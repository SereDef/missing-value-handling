name: Render and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed for deploy-pages. Set Settings -> Pages -> Source to "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

# Let a new push cancel an in-flight build, but never a half-finished deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The slides have no executable code, so only Quarto is needed.

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned to match the version this deck was authored against, so CI
          # output matches what you see locally. Bump deliberately.
          version: "1.7.29"

      - name: Render
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
